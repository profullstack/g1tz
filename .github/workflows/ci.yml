name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: typecheck, TUI, CLI and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: TUI and CLI
        run: bun test test
      - name: Teams server
        run: bun test server/test
      - name: Build
        run: bun run build

  node:
    name: the installed command on node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node bin/g1tz.mjs --help | grep -q "g1tz members invite"
      - run: node bin/g1tz.mjs / || test $? -eq 1

  container:
    name: production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag g1tz-ci .
      - name: Start the server and check the descriptor
        run: |
          docker run --detach --name g1tz-ci -e G1TZ_DB=:memory: -e G1TZ_URL=http://127.0.0.1:8080 -p 127.0.0.1:8080:3000 g1tz-ci
          trap 'docker logs g1tz-ci; docker rm --force g1tz-ci' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/.well-known/openaccess.json | grep -q '"offers"'
          curl --fail --silent http://127.0.0.1:8080/account | grep -q 'account.js'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/actions)" = 401
